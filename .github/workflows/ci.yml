name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. The suite is fast; the
# queue is what would make it feel slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest

    # The integration tests SKIP without a database, so without this service
    # the suite would go green while never running the double-booking
    # guarantee - the one thing in the project most worth proving. The image
    # matches docker-compose.yml so CI and a laptop agree.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: naijafares
          POSTGRES_PASSWORD: naijafares_dev
          POSTGRES_DB: naijafares
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naijafares -d naijafares"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        # The ML packages are a large, separate install and nothing under test
        # imports them - /predict returns a 503 explaining they are missing,
        # which is itself the documented behaviour.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: naijafares
          POSTGRES_PASSWORD: naijafares_dev
          POSTGRES_DB: naijafares
          # A skipped integration test here means the service container is
          # broken, not that someone is running without Docker. Turn it red -
          # see the `postgres` fixture in tests/conftest.py.
          REQUIRE_POSTGRES: "1"
          # Counted in memory here. Redis is how the counter is SHARED between
          # uvicorn workers, which no single-process test can observe anyway.
          RATE_LIMIT_ENABLED: "false"
        run: pytest -v

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm test
